<!--
  RMX wordmark — DARK variant (black on transparent), for use on light surfaces.

  Phase 1 PLACEHOLDER: typeset in IBM Plex Sans, weight 700, letter-spacing -0.02em.
  Replace with the supplied black wordmark when artwork is available. The viewBox,
  filename, and intended usage will not change — consumers can swap the file freely.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60" role="img" aria-label="RMX">
  <title>RMX</title>
  <text
    x="100" y="42"
    text-anchor="middle"
    font-family="'IBM Plex Sans', system-ui, sans-serif"
    font-weight="700"
    font-size="38"
    letter-spacing="-0.76"
    fill="#1A2433"
  >RMX</text>
</svg>
